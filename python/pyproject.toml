[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hushclient-sdk"
version = "0.1.0"
description = "Typed Python SDK for the HushClient credential membership API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Typing :: Typed",
]

[project.optional-dependencies]
dev = ["build>=1.2,<2", "mypy>=1.15,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hushclient = ["py.typed"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

